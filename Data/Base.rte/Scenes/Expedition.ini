AddScene = Scene
	PresetName = Expedition Highlands
	Description = Uncharted highlands. No two expeditions find the same land here.
	LocationOnPlanet = Vector
		X = 60
		Y = -150
	MetagamePlayable = 0
	PreviewBitmapFile = ContentFile
		FilePath = Base.rte/Scenes/Expedition Highlands.preview.png
	Terrain = SLTerrain
		CopyOf = Expedition Highlands Terrain
	GlobalAcceleration = Vector
		X = 0
		Y = 20
	AddBackgroundLayer = SLBackground
		CopyOf = Default Front
	AddBackgroundLayer = SLBackground
		CopyOf = Mountains Middle
	AddBackgroundLayer = SLBackground
		CopyOf = Mountains Back
	AddBackgroundLayer = SLBackground
		CopyOf = Clouds Layer A
	AddBackgroundLayer = SLBackground
		CopyOf = Mountains Backdrop Layer


