///////////////////////////////////////////////////////////////////////
// Expedition Sectors
// Procedurally generated scenes, a different terrain every time they're loaded. Used by the Expedition activity.


Terrain = SLTerrain
	PresetName = Expedition Highlands Terrain
	WrapX = 1
	WrapY = 0
	BackgroundTexture = ContentFile
		FilePath = Base.rte/Scenes/Textures/DirtDark.png
	ProceduralGenerator = TerrainGenerator
		Width = 2400
		Height = 1100
		SurfaceLevel = 0.32
		SurfaceAmplitude = 240
		SurfaceFeatureSize = 900
		SurfaceRoughness = 0.55
		CaveDensity = 0.12
		CaveFeatureSize = 140
		CaveMinDepth = 90
		AddLayer = TerrainGeneratorLayer
			Material = Material
				CopyOf = Topsoil
			Thickness = 30
		AddLayer = TerrainGeneratorLayer
			Material = Material
				CopyOf = Earth
			Thickness = 140
		AddLayer = TerrainGeneratorLayer
			Material = Material
				CopyOf = Dense Earth
			Thickness = 260
		AddLayer = TerrainGeneratorLayer
			Material = Material
				CopyOf = Stone
			Thickness = 300
	AddTerrainFrosting = TerrainFrosting
		TargetMaterial = Material
			CopyOf = Topsoil
		FrostingMaterial = Material
			CopyOf = Grass
		MinThickness = 5
		MaxThickness = 7
		InAirOnly = 1
	AddTerrainDebris = TerrainDebris
		CopyOf = Plants
	AddTerrainDebris = TerrainDebris
		CopyOf = Gold
		MaxDepth = 700
	AddTerrainDebris = TerrainDebris
		CopyOf = Fossils
	AddTerrainDebris = TerrainDebris
		CopyOf = Boulders
		DensityPerMeter = 0.5
	AddTerrainDebris = TerrainDebris
		CopyOf = Boulders
		TargetMaterial = Material
			CopyOf = Dense Earth
		MinDepth = 0
		MaxDepth = 400
		DensityPerMeter = 1.2


