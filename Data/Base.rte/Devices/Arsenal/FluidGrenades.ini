///////////////////////////////////////////////////////////////////////
// Fluid grenades: thrown devices that burst a couple of seconds after the pin is pulled and spill liquid or gas, which then flows through the terrain on its own.
// They share one script, which picks what to spill by the grenade's PresetName. Their sprites are recolored Frag Grenades.


///////////////////////////////////////////////////////////////////////
// Hydro Grenade: a splash of water, which puts out burning terrain and burning oil, and slows down whoever wades through it.


AddDevice = TDExplosive
	CopyOf = Frag Grenade
	PresetName = Hydro Grenade
	Description = Bursts into a splash of water a couple of seconds after the pin is pulled. Water puts out fires and burning napalm, boiling into steam, and slows down anyone wading through it.
	AddToGroup = Arsenal
	AddToGroup = Bombs
	AddToGroup = Bombs - Payloads
	ScriptPath = Base.rte/Devices/Arsenal/FluidGrenade.lua
	GoldValue = 15
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/HydroGrenade.png
	TriggerDelay = 600000


///////////////////////////////////////////////////////////////////////
// Acid Flask: acid that eats through terrain, digging its way down, and burns anyone standing in it.


AddDevice = TDExplosive
	CopyOf = Frag Grenade
	PresetName = Acid Flask
	Description = Shatters into a pool of acid a couple of seconds after the pin is pulled. The acid eats through the terrain beneath it, soft ground faster than rock, and burns anyone standing in it. Spent acid gives off toxic fumes.
	AddToGroup = Arsenal
	AddToGroup = Bombs
	AddToGroup = Bombs - Payloads
	ScriptPath = Base.rte/Devices/Arsenal/FluidGrenade.lua
	GoldValue = 40
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/AcidFlask.png
	TriggerDelay = 600000


///////////////////////////////////////////////////////////////////////
// Napalm Canister: a pool of burning oil, which spreads its fire to whatever's flammable around it.


AddDevice = TDExplosive
	CopyOf = Frag Grenade
	PresetName = Napalm Canister
	Description = Splashes burning oil around a couple of seconds after the pin is pulled. The oil flows downhill as it burns, setting grass, wood and anyone caught in it alight. Water puts it out.
	AddToGroup = Arsenal
	AddToGroup = Bombs
	AddToGroup = Bombs - Payloads
	ScriptPath = Base.rte/Devices/Arsenal/FluidGrenade.lua
	GoldValue = 45
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/NapalmCanister.png
	TriggerDelay = 600000


///////////////////////////////////////////////////////////////////////
// Toxin Grenade: a cloud of toxic gas that drifts upwards and hurts anyone who breathes it.


AddDevice = TDExplosive
	CopyOf = Frag Grenade
	PresetName = Toxin Grenade
	Description = Releases a cloud of toxic gas a couple of seconds after the pin is pulled. The gas drifts up and around, filling tunnels and bunkers, and hurts anyone with their head in it until it thins out.
	AddToGroup = Arsenal
	AddToGroup = Bombs
	AddToGroup = Bombs - Payloads
	ScriptPath = Base.rte/Devices/Arsenal/FluidGrenade.lua
	GoldValue = 35
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/ToxinGrenade.png
	TriggerDelay = 600000
