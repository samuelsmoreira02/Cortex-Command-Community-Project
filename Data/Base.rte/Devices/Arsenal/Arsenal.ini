///////////////////////////////////////////////////////////////////////
// Arsenal: weapons built around destructible terrain, ragdolls and chain reactions.
// They're made from the Base weapons, so they look the part without new art, and do their tricks in Lua.
// All of them can be bought, and they're also the legendary drops of the "Loot Drops" global script.


///////////////////////////////////////////////////////////////////////
// Shared effects


AddEffect = MOPixel
	CopyOf = Old Stock Blaster Pistol Trail Glow
	PresetName = Arsenal Arc Spark
	LifeTime = 140
	GlobalAccScalar = 0
	AirResistance = 0.4


AddEffect = MOPixel
	CopyOf = Spark Blue 1
	PresetName = Arsenal Ice Spark
	LifeTime = 400
	GlobalAccScalar = 0.2


AddSoundContainer = SoundContainer
	PresetName = Arsenal Arc Zap
	AttenuationStartDistance = 220
	PitchVariation = 0.1
	AddSound = ContentFile
		FilePath = Base.rte/Devices/Weapons/OldStock/BlasterPistol/Sounds/BlasterFire.flac


AddSoundContainer = SoundContainer
	PresetName = Arsenal Railgun Shot
	AttenuationStartDistance = 400
	SoundSelectionCycleMode = All
	AddSound = ContentFile
		FilePath = Base.rte/Devices/Weapons/OldStock/BlasterPistol/Sounds/BlasterFire.flac
	AddSound = ContentFile
		FilePath = Base.rte/Sounds/Devices/CannonFire1.flac


AddSoundContainer = SoundContainer
	PresetName = Arsenal Beacon Beep
	AttenuationStartDistance = 250
	AddSound = ContentFile
		FilePath = Base.rte/Sounds/Devices/BeepShort.flac


AddSoundContainer = SoundContainer
	PresetName = Arsenal Airstrike Incoming
	AttenuationStartDistance = 500
	AddSound = ContentFile
		FilePath = Base.rte/Sounds/Explosions/CrashWoosh1.flac
	AddSound = ContentFile
		FilePath = Base.rte/Sounds/Explosions/CrashWoosh2.flac


///////////////////////////////////////////////////////////////////////
// Arc Caster: bolts that chain lightning between nearby enemies.


AddAmmo = Round
	CopyOf = Round Old Stock Blaster Pistol
	PresetName = Round Arc Caster
	Particle = MOPixel
		CopyOf = Bullet Old Stock Blaster Pistol
		PresetName = Bullet Arc Caster
		ScriptPath = Base.rte/Devices/Arsenal/ArcBolt.lua


AddAmmo = Magazine
	CopyOf = Magazine Old Stock Blaster Pistol
	PresetName = Magazine Arc Caster
	RoundCount = 16
	RegularRound = Round
		CopyOf = Round Arc Caster
	TracerRound = Round
		CopyOf = Round Arc Caster


AddDevice = HDFirearm
	CopyOf = Old Stock Blaster Pistol
	PresetName = Arc Caster
	Description = Fires bolts that arc lightning from whatever they hit to up to three more enemies nearby. Great against tight groups.
	AddToGroup = Arsenal
	AddToGroup = Weapons
	AddToGroup = Weapons - Secondary
	AddToGroup = Weapons - Light
	GoldValue = 60
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/ArcCaster.png
	FrameCount = 2
	Magazine = Magazine
		CopyOf = Magazine Arc Caster
	RateOfFire = 320
	ReloadTime = 1600


///////////////////////////////////////////////////////////////////////
// Railgun: a charged shot that pierces everything in a line, terrain included.


AddDevice = HDFirearm
	CopyOf = Old Stock Battle Rifle
	PresetName = Railgun
	Description = Charges up, then fires a hypersonic slug that tears straight through terrain and every unit in its path. Slow, loud and devastating.
	AddToGroup = Arsenal
	AddToGroup = Weapons
	AddToGroup = Weapons - Primary
	AddToGroup = Weapons - Heavy
	AddToGroup = Weapons - Sniper
	ScriptPath = Base.rte/Devices/Arsenal/Railgun.lua
	GoldValue = 140
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/Railgun.png
	FrameCount = 2
	Magazine = Magazine
		CopyOf = Magazine Old Stock Battle Rifle
		PresetName = Magazine Railgun
		RoundCount = 3
		RegularRound = Round
			CopyOf = Null Round
		TracerRound = Round
			CopyOf = Null Round
	FireSound = SoundContainer
		CopyOf = Arsenal Railgun Shot
	ActivationDelay = 650
	RateOfFire = 40
	ReloadTime = 2800
	FullAuto = 0


