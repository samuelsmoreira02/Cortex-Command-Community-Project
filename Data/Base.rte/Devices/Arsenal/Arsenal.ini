///////////////////////////////////////////////////////////////////////
// Cryo Projector: a freezing spray. Frozen units can't move and shatter easily.


AddAmmo = Round
	PresetName = Round Cryo Projector
	ParticleCount = 3
	Particle = MOPixel
		PresetName = Particle Cryo Projector
		ScriptPath = Base.rte/Devices/Arsenal/CryoParticle.lua
		Mass = 0.01
		LifeTime = 450
		Sharpness = 0
		HitsMOs = 1
		GetsHitByMOs = 0
		GlobalAccScalar = 0.1
		AirResistance = 0.08
		Color = Color
			R = 204
			G = 234
			B = 255
		Atom = Atom
			Material = Material
				CopyOf = Air
			TrailColor = Color
				R = 150
				G = 220
				B = 255
			TrailLength = 8
		ScreenEffect = ContentFile
			FilePath = Base.rte/Effects/Glows/LightBlueTiny.png
		EffectAlwaysShows = 1
	FireVelocity = 32
	Separation = 3


AddAmmo = Magazine
	CopyOf = Magazine Old Stock SMG
	PresetName = Magazine Cryo Projector
	RoundCount = 120
	RegularRound = Round
		CopyOf = Round Cryo Projector
	TracerRound = Round
		CopyOf = Round Cryo Projector


AddDevice = HDFirearm
	CopyOf = Old Stock SMG
