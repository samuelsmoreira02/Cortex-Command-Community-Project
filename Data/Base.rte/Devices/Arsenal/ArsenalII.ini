///////////////////////////////////////////////////////////////////////
// Arsenal II: six more weapons, built the same way as the first Arsenal.
// Their sprites are recolored Base weapons, and any of them can be swapped for local art by putting an image at the same path under Userdata/SpriteOverrides/.


AddSoundContainer = SoundContainer
	PresetName = Arsenal Beam Hum
	AttenuationStartDistance = 150
	AddSound = ContentFile
		FilePath = Base.rte/Devices/Tools/Digger/Sounds/DiggerActive.flac
	LoopSetting = -1


AddAmmo = Magazine
	CopyOf = Null Magazine Infinite
	PresetName = Magazine Arsenal Infinite Beam


///////////////////////////////////////////////////////////////////////
// Gravity Gun: hold fire to grab whatever's in front of you, let go to fling it.


AddDevice = HDFirearm
	CopyOf = Old Stock SMG
	PresetName = Gravity Gun
	Description = Hold fire to grab the nearest unit, item or piece of debris in front of you and hold it in the air. Let go to fling it. Enemies thrown into walls, or each other, don't get up.
	AddToGroup = Weapons
	AddToGroup = Weapons - Primary
	AddToGroup = Weapons - Light
	ScriptPath = Base.rte/Devices/Arsenal/GravityGun.lua
	GoldValue = 110
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/GravityGun.png
	FrameCount = 2
	Magazine = Magazine
		CopyOf = Magazine Arsenal Infinite Beam
	FireSound = SoundContainer
		CopyOf = Arsenal Beam Hum
	RateOfFire = 600
	FullAuto = 1


///////////////////////////////////////////////////////////////////////
// Tunneler: a missile that bores through the ground and blows up inside it.


AddAmmo = AEmitter
	CopyOf = Particle Rocket Launcher
	PresetName = Tunneler Drill
	ScriptPath = Base.rte/Devices/Arsenal/TunnelerDrill.lua
	LifeTime = 1800


AddDevice = HDFirearm
	CopyOf = Rocket Launcher
	PresetName = Tunneler
	Description = Fires a drilling missile that bores straight through the ground, leaving a tunnel behind it, and blows up when it runs into someone or runs out of fuel. Dig an entrance, or bring the ceiling down on whoever's hiding underneath.
	AddToGroup = Weapons
	AddToGroup = Weapons - Primary
	AddToGroup = Weapons - Heavy
	AddToGroup = Weapons - Explosive
	ScriptPath = Base.rte/Devices/Arsenal/Tunneler.lua
	GoldValue = 130
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/Tunneler.png
	FrameCount = 1
	Magazine = Magazine
		CopyOf = Magazine Rocket Launcher
		PresetName = Magazine Tunneler
		RegularRound = Round
			CopyOf = Null Round
		TracerRound = Round
			CopyOf = Null Round


///////////////////////////////////////////////////////////////////////
// Chakram Launcher: a spinning energy blade that flies out, cuts through everything and comes back.


AddEffect = MOPixel
	PresetName = Chakram Blade
	ScriptPath = Base.rte/Devices/Arsenal/Chakram.lua
	Mass = 0.5
	LifeTime = 5000
	HitsMOs = 0
	GetsHitByMOs = 0
	GlobalAccScalar = 0
	Color = Color
		R = 200
		G = 255
		B = 220
	Atom = Atom
		Material = Material
			CopyOf = Air
		TrailColor = Color
			R = 120
			G = 255
			B = 180
		TrailLength = 0
	ScreenEffect = ContentFile
		FilePath = Base.rte/Effects/Glows/GreenSmall.png
	EffectAlwaysShows = 1


AddDevice = HDFirearm
	CopyOf = Old Stock Shotgun
	PresetName = Chakram Launcher
	Description = Throws a spinning energy blade that slices through everyone and everything in its path, then comes back for a second pass.
	AddToGroup = Weapons
	AddToGroup = Weapons - Primary
	AddToGroup = Weapons - CQB
	ScriptPath = Base.rte/Devices/Arsenal/ChakramLauncher.lua
	GoldValue = 100
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/ChakramLauncher.png
	FrameCount = 2
	Magazine = Magazine
		CopyOf = Magazine Old Stock Shotgun
		PresetName = Magazine Chakram Launcher
		RoundCount = 3
		RegularRound = Round
			CopyOf = Null Round
		TracerRound = Round
			CopyOf = Null Round
	RateOfFire = 90
	ReloadTime = 2000


///////////////////////////////////////////////////////////////////////
// Plasma Cutter: a short, hot beam that melts through ground and armor alike.


AddDevice = HDFirearm
	CopyOf = Old Stock Pistol
	PresetName = Plasma Cutter
	Description = A short-range cutting beam. Melts through ground and rock as fast as a digger, and through anyone standing too close just as easily.
	AddToGroup = Weapons
	AddToGroup = Weapons - Secondary
	AddToGroup = Tools
	AddToGroup = Tools - Diggers
	ScriptPath = Base.rte/Devices/Arsenal/PlasmaCutter.lua
	GoldValue = 70
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/PlasmaCutter.png
	FrameCount = 2
	Magazine = Magazine
		CopyOf = Magazine Arsenal Infinite Beam
	FireSound = SoundContainer
		CopyOf = Arsenal Beam Hum
	RateOfFire = 1200
	FullAuto = 1


///////////////////////////////////////////////////////////////////////
// Sentry Deployer: throw it and it unfolds into a friendly turret for half a minute.


AddDevice = TDExplosive
	CopyOf = Frag Grenade
	PresetName = Sentry Deployer
	Description = Throw it and, once it settles, it unfolds into a turret that fights for your team for 30 seconds before it breaks down.
	AddToGroup = Bombs
	AddToGroup = Bombs - Payloads
	ScriptPath = Base.rte/Devices/Arsenal/SentryDeployer.lua
	GoldValue = 90
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/SentryDeployer.png
	FrameCount = 2
	TriggerDelay = 600000


///////////////////////////////////////////////////////////////////////
// Tesla Trap: sticks to the ground and zaps every enemy that comes close.


AddDevice = TDExplosive
	CopyOf = Frag Grenade
	PresetName = Tesla Trap
	Description = Throw it down and it anchors itself, then zaps up to two enemies at a time that come near it, until its charge runs out and it overloads with a bang.
	AddToGroup = Bombs
	AddToGroup = Bombs - Payloads
	ScriptPath = Base.rte/Devices/Arsenal/TeslaTrap.lua
	GoldValue = 75
	Buyable = 1
	BuyableMode = 0
	SpriteFile = ContentFile
		FilePath = Base.rte/Devices/Arsenal/Sprites/TeslaTrap.png
	FrameCount = 2
	TriggerDelay = 600000
